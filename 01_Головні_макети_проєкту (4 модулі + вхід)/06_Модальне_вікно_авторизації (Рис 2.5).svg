<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
<defs>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap");
    text { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
  <linearGradient id="modalBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#6366F1"/>
    <stop offset="50%" stop-color="#A855F7"/>
    <stop offset="100%" stop-color="#3B82F6"/>
  </linearGradient>
  <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#4F46E5"/>
    <stop offset="100%" stop-color="#6366F1"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
  </filter>
</defs>

<!-- Blurred Dark Background simulating the app behind modal -->
<rect width="1440" height="960" fill="#070B14"/>
<g opacity="0.15">
  <rect x="0" y="0" width="1440" height="50" fill="#0E1526"/>
  <rect x="0" y="50" width="240" height="910" fill="#0C1220"/>
  <rect x="270" y="80" width="540" height="260" rx="12" fill="#131D31"/>
  <rect x="830" y="80" width="570" height="260" rx="12" fill="#131D31"/>
  <rect x="270" y="360" width="1130" height="560" rx="12" fill="#131D31"/>
</g>
<rect width="1440" height="960" fill="rgba(7, 11, 20, 0.78)"/>

<!-- Modal Window Container -->
<g id="Auth_Modal_Dialog" transform="translate(370, 130)" filter="url(#shadow)">
  <!-- Outer glowing border -->
  <rect x="-2" y="-2" width="704" height="704" rx="20" fill="none" stroke="url(#modalBorderGrad)" stroke-width="2.5" opacity="0.85"/>
  <!-- Main modal background -->
  <rect x="0" y="0" width="700" height="700" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Modal Header -->
  <g id="Modal_Content_Container" transform="translate(45, 45)">
    <!-- Logo Badge -->
    <rect x="0" y="0" width="42" height="42" rx="10" fill="url(#btnGrad)"/>
    <text font-family="Inter, sans-serif" x="21" y="27" fill="#FFFFFF" font-size="16" font-weight="800" text-anchor="middle">MkV</text>
    
    <text font-family="Inter, sans-serif" x="56" y="22" fill="#FFFFFF" font-size="20" font-weight="800" letter-spacing="-0.3">MkV Sales Manager CRM</text>
    <rect x="330" y="7" width="85" height="20" rx="10" fill="rgba(99, 102, 241, 0.2)" stroke="#6366F1" stroke-width="1"/>
    <text font-family="Inter, sans-serif" x="372" y="21" fill="#818CF8" font-size="10" font-weight="700" text-anchor="middle">B2B SaaS OS</text>
    
    <!-- Close icon -->
    <text font-family="Inter, sans-serif" x="590" y="24" fill="#64748B" font-size="20" cursor="pointer">✕</text>

    <!-- Subtitle -->
    <text font-family="Inter, sans-serif" x="0" y="65" fill="#FFFFFF" font-size="19" font-weight="700">АВТОРИЗАЦІЯ ТАРГЕТОЛОГА ТА API ДОСТУП</text>
    <text font-family="Inter, sans-serif" x="0" y="88" fill="#94A3B8" font-size="13">Підключіть корпоративний акаунт або системні токени рекламних мереж</text>

    <!-- OAuth Button: Google & Meta SSO -->
    <g id="Btn_OAuth_Google_Meta" transform="translate(0, 115)" cursor="pointer">
      <rect x="0" y="0" width="610" height="56" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <!-- Icon indicator -->
      <circle cx="36" cy="28" r="14" fill="#1877F2"/>
      <text font-family="Inter, sans-serif" x="36" y="34" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">f</text>
      <text font-family="Inter, sans-serif" x="64" y="26" fill="#FFFFFF" font-size="14" font-weight="600">SIGN IN WITH META BUSINESS &amp; GOOGLE SSO</text>
      <text font-family="Inter, sans-serif" x="64" y="44" fill="#38BDF8" font-size="11" font-weight="500">Автоматичний імпорт Marketing API токенів та рекламних кабінетів</text>
    </g>

    <!-- Divider -->
    <g transform="translate(0, 198)">
      <line x1="0" y1="0" x2="210" y2="0" stroke="#334155" stroke-width="1"/>
      <text font-family="Inter, sans-serif" x="305" y="4" fill="#64748B" font-size="11.5" font-weight="600" text-anchor="middle">АБО ВВЕДІТЬ КОРПОРАТИВНИЙ ДОСТУП</text>
      <line x1="400" y1="0" x2="610" y2="0" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- Input 1: Email / Callsign -->
    <g id="Input_Corporate_Email" transform="translate(0, 222)">
      <text font-family="Inter, sans-serif" x="0" y="0" fill="#94A3B8" font-size="11.5" font-weight="600" letter-spacing="0.5">КОРПОРАТИВНА ПОШТА АБО ЛОГІН СПЕЦІАЛІСТА</text>
      <rect x="0" y="10" width="610" height="48" rx="8" fill="#0A0F1D" stroke="#334155" stroke-width="1.2"/>
      <text font-family="Inter, sans-serif" x="18" y="40" fill="#F8FAFC" font-size="13.5" font-weight="500">mykhailo.bahyn@student.uzhnu.edu.ua</text>
      <!-- Check icon -->
      <circle cx="585" cy="34" r="8" fill="#10B981"/>
      <text font-family="Inter, sans-serif" x="585" y="38" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">✓</text>
    </g>

    <!-- Input 2: Password / API Key -->
    <g id="Input_API_Token" transform="translate(0, 305)">
      <text font-family="Inter, sans-serif" x="0" y="0" fill="#94A3B8" font-size="11.5" font-weight="600" letter-spacing="0.5">СЕКРЕТНИЙ КЛЮЧ / API JWT ТОКЕН ДОСТУПУ</text>
      <rect x="0" y="10" width="610" height="48" rx="8" fill="#0A0F1D" stroke="#334155" stroke-width="1.2"/>
      <text font-family="Inter, sans-serif" x="18" y="40" fill="#94A3B8" font-size="15" font-weight="700">••••••••••••••••••••••••••••••••</text>
      <text font-family="Inter, sans-serif" x="560" y="39" fill="#64748B" font-size="13" font-weight="600" cursor="pointer">Показати</text>
    </g>

    <!-- Checkbox & Forgot link -->
    <g transform="translate(0, 388)">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#6366F1"/>
      <text font-family="Inter, sans-serif" x="8" y="12" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">✓</text>
      <text font-family="Inter, sans-serif" x="26" y="13" fill="#CBD5E1" font-size="12.5" font-weight="500">Запам'ятати робочу станцію (Remember workstation)</text>
      <text font-family="Inter, sans-serif" x="610" y="13" fill="#818CF8" font-size="12" font-weight="600" text-anchor="end" cursor="pointer">Забули ключ доступу?</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 428)" cursor="pointer">
      <rect x="0" y="0" width="610" height="52" rx="10" fill="url(#btnGrad)"/>
      <text font-family="Inter, sans-serif" x="305" y="32" fill="#FFFFFF" font-size="14.5" font-weight="700" text-anchor="middle" letter-spacing="0.4">АВТОРИЗУВАТИСЯ ТА УВІЙТИ В РОБОЧИЙ ПРОСТІР</text>
    </g>

    <!-- Security Badges Footer -->
    <g transform="translate(0, 510)">
      <circle cx="100" cy="5" r="3" fill="#10B981"/>
      <text font-family="Inter, sans-serif" x="110" y="9" fill="#64748B" font-size="11" font-weight="500">AES-256 SSL Encrypted</text>
      
      <circle cx="280" cy="5" r="3" fill="#6366F1"/>
      <text font-family="Inter, sans-serif" x="290" y="9" fill="#64748B" font-size="11" font-weight="500">OAuth 2.0 PKCE Handshake</text>

      <circle cx="475" cy="5" r="3" fill="#06B6D4"/>
      <text font-family="Inter, sans-serif" x="485" y="9" fill="#64748B" font-size="11" font-weight="500">RBAC Role: Admin / Buyer</text>
    </g>
  </g>
</g>
</svg>
